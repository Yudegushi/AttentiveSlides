<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: "IBM Plex Sans", "Noto Sans", "DejaVu Sans", sans-serif; }
    #root { width: 100%; }
    #slide { position: relative; width: 100%; margin-inline: 0 auto; line-height: 0; user-select: none; }
    #slide img {
      background: var(--as-surface);
      border: 1px solid var(--as-border-strong);
      border-radius: 0;
      box-shadow: 0 8px 18px rgba(38, 55, 52, 0.09);
      display: block;
      height: auto;
      width: 100%;
    }
    #overlay { position: absolute; inset: 0; pointer-events: none; }
    .aoi { position: absolute; border: 2px solid rgba(15, 118, 110, .72); background: rgba(45, 212, 191, .10); }
    .aoi-live-candidate {
      border-color: rgba(217, 119, 6, .95);
      background: rgba(251, 191, 36, .14);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, .20), 0 0 18px rgba(245, 158, 11, .32);
    }
    .aoi-server-match {
      border-color: rgba(220, 38, 38, 1);
      border-width: 3px;
      background: rgba(239, 68, 68, .12);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, .22), 0 0 24px rgba(220, 38, 38, .48);
    }
    .gaze-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border: 1px solid rgba(72, 84, 78, 0.18);
      border-radius: 999px;
      background: rgba(72, 84, 78, 0.16);
      box-shadow: 0 0 8px 5px rgba(72, 84, 78, 0.08);
      display: none;
      z-index: 20;
      pointer-events: none;
    }
    #manual { position: absolute; border: 2px solid #f97316; background: rgba(249, 115, 22, .14); display: none; }
    #slide.drawing { cursor: crosshair; touch-action: none; }
    #error { padding: 12px; color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; border-radius: 3px; font-size: 12px; line-height: 17px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1,
    }, "*");
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: 50,
    }, "*");
  </script>
  <script>
    (() => {
      const root = document.getElementById("root");
      const SEMANTIC_KEYS = [
        "canvas", "workspace", "topbar", "rail", "surface", "ink", "muted",
        "muted-2", "border", "border-strong", "primary", "primary-on",
        "primary-soft", "segment", "slide-accent", "slide-accent-soft",
      ];
      let args = null;
      let image = null;
      let slide = null;
      let overlay = null;
      let manual = null;
      let observer = null;
      let revision = 0;
      let manualBBox = null;
      let dragStart = null;
      let scheduled = false;
      let reportTimer = null;
      let componentValueRequested = false;
      let geometryInFlight = false;
      let pendingGeometry = null;
      let lastReportedSignature = null;
      let lastCoordinateErrorSignature = null;
      let lastRequestedRevision = null;
      let parentScrollHandler = null;
      let resizeHandler = null;
      const DEBUG_CHANNEL_NAME = "attentiveslides-gaze-debug-v1";
      const GAZE_STALE_AFTER_MS = 1000;
      const debugChannel = typeof BroadcastChannel === "function"
        ? new BroadcastChannel(DEBUG_CHANNEL_NAME)
        : null;
      let gazeDot = null;
      let gazeStaleTimer = null;
      let liveCandidateAoiId = null;
      let serverMatchedAoiId = null;
      let aoiElements = new Map();

      function send(type, payload = {}) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type,
          ...payload,
        }, "*");
      }

      function setValue(value) {
        send("streamlit:setComponentValue", { value });
      }

      function setFrameHeight() {
        send("streamlit:setFrameHeight", {
          height: Math.ceil(root.getBoundingClientRect().height),
        });
      }

      function applyPalette(paletteTokens) {
        const tokens = paletteTokens && typeof paletteTokens === "object"
          ? paletteTokens
          : {};
        for (const name of SEMANTIC_KEYS) {
          const value = tokens[name];
          if (typeof value === "string" && value.trim()) {
            document.documentElement.style.setProperty("--as-" + name, value);
          }
        }
      }

      async function flushGeometry() {
        if (geometryInFlight || pendingGeometry === null) return;
        const payload = pendingGeometry;
        pendingGeometry = null;
        geometryInFlight = true;
        try {
          const response = await fetch("/attentive-media/geometry", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!response.ok) throw new Error(await response.text() || `HTTP ${response.status}`);
        } catch (error) {
          console.warn("AttentiveSlides geometry upload failed", error);
        } finally {
          geometryInFlight = false;
          if (pendingGeometry !== null) void flushGeometry();
        }
      }

      function postGeometry(payload) {
        pendingGeometry = payload;
        void flushGeometry();
      }

      function coordinateContext() {
        try {
          if (!window.frameElement) {
            throw new Error("component frame element is unavailable");
          }
          const frameRect = window.frameElement.getBoundingClientRect();
          const viewportWidth = window.parent.innerWidth;
          const viewportHeight = window.parent.innerHeight;
          if (!(viewportWidth > 0 && viewportHeight > 0)) {
            throw new Error("parent viewport dimensions are unavailable");
          }
          lastCoordinateErrorSignature = null;
          return { frameRect, viewportWidth, viewportHeight };
        } catch (error) {
          const errorPayload = {
            deck_id: args ? args.deck_id : null,
            slide_id: args ? args.slide_id : null,
            coordinate_error: String(error && error.message ? error.message : error),
          };
          const errorSignature = JSON.stringify(errorPayload);
          if (errorSignature === lastCoordinateErrorSignature) return null;
          lastCoordinateErrorSignature = errorSignature;
          lastReportedSignature = null;
          setValue(errorPayload);
          return null;
        }
      }

      function viewportRect(localRect, frameRect) {
        return {
          x1: frameRect.left + localRect.left,
          y1: frameRect.top + localRect.top,
          x2: frameRect.left + localRect.right,
          y2: frameRect.top + localRect.bottom,
        };
      }

      function clearAuxiliaryGaze() {
        window.clearTimeout(gazeStaleTimer);
        gazeStaleTimer = null;
        liveCandidateAoiId = null;
        if (gazeDot) gazeDot.style.display = "none";
        refreshDebugClasses();
      }

      function refreshDebugClasses() {
        for (const [aoiId, element] of aoiElements.entries()) {
          element.classList.remove("aoi-live-candidate", "aoi-server-match");
          if (serverMatchedAoiId === aoiId) {
            element.classList.add("aoi-server-match");
          } else if (liveCandidateAoiId === aoiId) {
            element.classList.add("aoi-live-candidate");
          }
        }
      }

      function finiteNumber(value) {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : null;
      }

      function eligibleAoi(aoi) {
        const excluded = new Set(["whole_slide", "footer", "page_number", "decoration", "background"]);
        const type = String(aoi && aoi.type || "").trim().toLowerCase().replaceAll("-", "_").replaceAll(" ", "_");
        return Boolean(aoi && aoi.aoi_id && Array.isArray(aoi.bbox) && aoi.bbox.length === 4)
          && !excluded.has(type)
          && String(aoi.aoi_id) !== "whole_slide";
      }

      function previewCandidate(normalizedX, normalizedY) {
        const candidates = (args.aois || []).filter(eligibleAoi).filter((aoi) => {
          const [x1, y1, x2, y2] = aoi.bbox.map(Number);
          return x1 <= normalizedX && normalizedX <= x2 && y1 <= normalizedY && normalizedY <= y2;
        });
        candidates.sort((left, right) => {
          const leftCenter = Math.hypot(normalizedX - (Number(left.bbox[0]) + Number(left.bbox[2])) / 2,
            normalizedY - (Number(left.bbox[1]) + Number(left.bbox[3])) / 2);
          const rightCenter = Math.hypot(normalizedX - (Number(right.bbox[0]) + Number(right.bbox[2])) / 2,
            normalizedY - (Number(right.bbox[1]) + Number(right.bbox[3])) / 2);
          return leftCenter - rightCenter || String(left.aoi_id).localeCompare(String(right.aoi_id));
        });
        return candidates.length ? String(candidates[0].aoi_id) : null;
      }

      function handleGazeMessage(message) {
        if (!args || !args.show_aoi_overlay || !image || !image.complete) return clearAuxiliaryGaze();
        if (!message.valid || !message.face_detected || message.source !== "eyetheia_local") return clearAuxiliaryGaze();
        const x = finiteNumber(message.x_css);
        const y = finiteNumber(message.y_css);
        const width = finiteNumber(message.viewport_width);
        const height = finiteNumber(message.viewport_height);
        if (x === null || y === null || width === null || height === null) return clearAuxiliaryGaze();
        const context = coordinateContext();
        if (!context || Math.abs(width - context.viewportWidth) > 1 || Math.abs(height - context.viewportHeight) > 1) {
          return clearAuxiliaryGaze();
        }
        const localRect = image.getBoundingClientRect();
        const slideRect = viewportRect(localRect, context.frameRect);
        if (x < slideRect.x1 || x > slideRect.x2 || y < slideRect.y1 || y > slideRect.y2) return clearAuxiliaryGaze();
        const normalizedX = (x - slideRect.x1) / (slideRect.x2 - slideRect.x1);
        const normalizedY = (y - slideRect.y1) / (slideRect.y2 - slideRect.y1);
        gazeDot.style.left = `${normalizedX * 100}%`;
        gazeDot.style.top = `${normalizedY * 100}%`;
        gazeDot.style.display = "block";
        liveCandidateAoiId = previewCandidate(normalizedX, normalizedY);
        refreshDebugClasses();
        window.clearTimeout(gazeStaleTimer);
        gazeStaleTimer = window.setTimeout(clearAuxiliaryGaze, GAZE_STALE_AFTER_MS);
      }

      function handleServerMatch(message) {
        if (!args) return;
        if (
          String(message.deck_id) !== String(args.deck_id)
          || Number(message.slide_id) !== Number(args.slide_id)
        ) return;
        const requested = message.aoi_id ? String(message.aoi_id) : null;
        serverMatchedAoiId = requested && aoiElements.has(requested) ? requested : null;
        refreshDebugClasses();
      }

      function geometrySignature(payload) {
        return JSON.stringify(payload, function (key, value) {
          if (key === "browser_timestamp_ms") return undefined;
          if (typeof value !== "number") return value;
          const precision = this === payload.manual_bbox ? 10000 : 10;
          return Math.round(value * precision) / precision;
        });
      }

      function report() {
        scheduled = false;
        const shouldSetComponentValue = componentValueRequested;
        componentValueRequested = false;
        if (!args || !image || !image.complete || !image.naturalWidth) return;
        setFrameHeight();
        const context = coordinateContext();
        if (!context) return;
        const localSlideRect = image.getBoundingClientRect();
        if (!(localSlideRect.width > 0 && localSlideRect.height > 0)) return;
        const slideRect = viewportRect(localSlideRect, context.frameRect);
        const aoiRects = {};
        for (const aoi of args.aois || []) {
          if (!aoi || !aoi.aoi_id || !Array.isArray(aoi.bbox) || aoi.bbox.length !== 4) continue;
          const [x1, y1, x2, y2] = aoi.bbox.map(Number);
          aoiRects[String(aoi.aoi_id)] = {
            x1: slideRect.x1 + x1 * localSlideRect.width,
            y1: slideRect.y1 + y1 * localSlideRect.height,
            x2: slideRect.x1 + x2 * localSlideRect.width,
            y2: slideRect.y1 + y2 * localSlideRect.height,
          };
        }
        const payload = {
          deck_id: String(args.deck_id),
          slide_id: Number(args.slide_id),
          viewport_width: Number(context.viewportWidth),
          viewport_height: Number(context.viewportHeight),
          device_pixel_ratio: Number(window.devicePixelRatio || 1),
          slide_rect: slideRect,
          slide_pixel_width: localSlideRect.width,
          slide_pixel_height: localSlideRect.height,
          aoi_rects: aoiRects,
          manual_bbox: manualBBox,
          browser_timestamp_ms: performance.timeOrigin + performance.now(),
        };
        const signature = geometrySignature(payload);
        if (signature !== lastReportedSignature) {
          revision += 1;
          lastReportedSignature = signature;
          payload.layout_revision = revision;
          postGeometry(payload);
        }
        payload.layout_revision = revision;
        if (shouldSetComponentValue) {
          setValue(Object.assign({ event: "manual_selection" }, payload));
        }
        setFrameHeight();
      }

      function scheduleReport({ componentValue = false } = {}) {
        componentValueRequested ||= componentValue;
        if (scheduled) return;
        scheduled = true;
        window.requestAnimationFrame(report);
      }

      function scheduleThrottledReport() {
        if (reportTimer !== null) return;
        reportTimer = window.setTimeout(() => {
          reportTimer = null;
          scheduleReport();
        }, 180);
      }

      function normalizedPoint(event) {
        const rect = image.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
          y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height)),
        };
      }

      function showManualBBox(bbox) {
        if (!manual || !bbox) return;
        const [x1, y1, x2, y2] = bbox;
        manual.style.display = "block";
        manual.style.left = `${x1 * 100}%`;
        manual.style.top = `${y1 * 100}%`;
        manual.style.width = `${(x2 - x1) * 100}%`;
        manual.style.height = `${(y2 - y1) * 100}%`;
      }

      function drawManual(current) {
        if (!dragStart || !current) return;
        showManualBBox([
          Math.min(dragStart.x, current.x),
          Math.min(dragStart.y, current.y),
          Math.max(dragStart.x, current.x),
          Math.max(dragStart.y, current.y),
        ]);
      }

      function beginDraw(event) {
        if (!args.drawing_enabled) return;
        event.preventDefault();
        slide.setPointerCapture(event.pointerId);
        dragStart = normalizedPoint(event);
        drawManual(dragStart);
      }

      function moveDraw(event) {
        if (!dragStart) return;
        event.preventDefault();
        drawManual(normalizedPoint(event));
      }

      function endDraw(event) {
        if (!dragStart) return;
        event.preventDefault();
        const end = normalizedPoint(event);
        const bbox = [
          Math.min(dragStart.x, end.x),
          Math.min(dragStart.y, end.y),
          Math.max(dragStart.x, end.x),
          Math.max(dragStart.y, end.y),
        ];
        if (bbox[2] - bbox[0] < 0.005 || bbox[3] - bbox[1] < 0.005) {
          manualBBox = null;
          manual.style.display = "none";
        } else {
          manualBBox = bbox;
          drawManual(end);
        }
        dragStart = null;
        scheduleReport({ componentValue: true });
      }

      function cleanupListeners() {
        if (observer) observer.disconnect();
        observer = null;
        if (reportTimer !== null) {
          window.clearTimeout(reportTimer);
          reportTimer = null;
        }
        if (resizeHandler) {
          window.removeEventListener("resize", resizeHandler);
          try { window.parent.removeEventListener("resize", resizeHandler); } catch (_) {}
        }
        if (parentScrollHandler) {
          try { window.parent.removeEventListener("scroll", parentScrollHandler, true); } catch (_) {}
        }
      }

      function render(nextArgs) {
        cleanupListeners();
        applyPalette(nextArgs.palette_tokens);
        const requestedRevision = Number(nextArgs.layout_revision) || 0;
        const sameSlideIdentity = Boolean(args)
          && String(args.deck_id) === String(nextArgs.deck_id)
          && Number(args.slide_id) === Number(nextArgs.slide_id);
        if (!sameSlideIdentity) {
          serverMatchedAoiId = null;
          clearAuxiliaryGaze();
        } else if (nextArgs.clear_server_match) {
          serverMatchedAoiId = null;
        }
        const preserveManualBBox = sameSlideIdentity
          && Boolean(nextArgs.drawing_enabled)
          && requestedRevision === lastRequestedRevision;
        args = nextArgs;
        revision = Math.max(revision, requestedRevision);
        if (!preserveManualBBox) manualBBox = null;
        lastRequestedRevision = requestedRevision;
        root.innerHTML = "";

        slide = document.createElement("div");
        slide.id = "slide";
        slide.className = args.drawing_enabled ? "drawing" : "";
        const requestedWidth = Number(args.display_width_percent);
        const displayWidth = Math.max(50, Math.min(100, Number.isFinite(requestedWidth) ? requestedWidth : 100));
        slide.style.width = `${displayWidth}%`;
        image = document.createElement("img");
        image.alt = `Slide ${args.slide_id}`;
        image.draggable = false;
        overlay = document.createElement("div");
        overlay.id = "overlay";
        manual = document.createElement("div");
        manual.id = "manual";
        aoiElements = new Map();

        if (args.show_aoi_overlay) {
          for (const aoi of args.aois || []) {
            if (!aoi || !Array.isArray(aoi.bbox) || aoi.bbox.length !== 4) continue;
            const box = document.createElement("div");
            box.className = "aoi";
            box.dataset.aoiId = String(aoi.aoi_id || "");
            box.style.left = `${Number(aoi.bbox[0]) * 100}%`;
            box.style.top = `${Number(aoi.bbox[1]) * 100}%`;
            box.style.width = `${(Number(aoi.bbox[2]) - Number(aoi.bbox[0])) * 100}%`;
            box.style.height = `${(Number(aoi.bbox[3]) - Number(aoi.bbox[1])) * 100}%`;
            overlay.appendChild(box);
            aoiElements.set(String(aoi.aoi_id || ""), box);
          }
        }
        gazeDot = document.createElement("div");
        gazeDot.className = "gaze-dot";
        overlay.appendChild(gazeDot);
        overlay.appendChild(manual);
        slide.appendChild(image);
        slide.appendChild(overlay);
        root.appendChild(slide);
        refreshDebugClasses();
        if (manualBBox) showManualBBox(manualBBox);

        slide.addEventListener("pointerdown", beginDraw);
        slide.addEventListener("pointermove", moveDraw);
        slide.addEventListener("pointerup", endDraw);
        slide.addEventListener("pointercancel", endDraw);
        image.addEventListener("load", scheduleReport, { once: true });
        image.src = args.image_data_url;

        resizeHandler = scheduleThrottledReport;
        parentScrollHandler = scheduleThrottledReport;
        window.addEventListener("resize", resizeHandler);
        try {
          window.parent.addEventListener("resize", resizeHandler);
          window.parent.addEventListener("scroll", parentScrollHandler, true);
        } catch (_) {
          scheduleReport();
        }
        observer = new ResizeObserver(scheduleThrottledReport);
        observer.observe(slide);
        setFrameHeight();
        scheduleReport();
      }

      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "streamlit:render") {
          render(event.data.args || {});
        }
      });
      if (debugChannel) {
        debugChannel.addEventListener("message", (event) => {
          const message = event.data || {};
          if (message.version !== 1) return;
          if (message.kind === "gaze") handleGazeMessage(message);
          if (message.kind === "gaze_clear") clearAuxiliaryGaze();
          if (message.kind === "server_match") handleServerMatch(message);
        });
      }
      window.addEventListener("pagehide", () => {
        clearAuxiliaryGaze();
        if (debugChannel) debugChannel.close();
      });
      setFrameHeight();
    })();
  </script>
</body>
</html>
