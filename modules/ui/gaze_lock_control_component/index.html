<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { background: transparent; margin: 0; padding: 0; }
    button {
      background: var(--as-primary); border: 1px solid var(--as-primary);
      border-radius: 4px; color: var(--as-primary-on); cursor: pointer;
      font: 700 12px/16px "IBM Plex Sans", "Noto Sans", sans-serif;
      min-height: 40px; padding: 8px 12px; width: 100%;
    }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:focus-visible {
      outline: 2px solid var(--as-primary); outline-offset: 2px;
    }
  </style>
</head>
<body>
  <button id="lock" type="button" disabled>LOCK GAZE TARGET</button>
  <script>
    (() => {
      const button = document.getElementById("lock");
      let submitted = false;

      function send(type, payload = {}) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type, ...payload },
          "*",
        );
      }

      function setValue(value) {
        send("streamlit:setComponentValue", { value });
      }

      function eventId() {
        if (globalThis.crypto && typeof crypto.randomUUID === "function") {
          return "lock-" + crypto.randomUUID();
        }
        return "lock-" + String(performance.timeOrigin + performance.now())
          + "-" + Math.random().toString(16).slice(2);
      }

      function submitLock() {
        if (button.disabled || submitted) return;
        submitted = true;
        button.disabled = true;
        setValue({
          event: "gaze_lock",
          event_id: eventId(),
          clicked_at_browser_ms: performance.timeOrigin + performance.now(),
        });
      }

      button.addEventListener("click", submitLock);

      button.addEventListener("keyup", (event) => {
        if (event.key !== "Tab" || event.shiftKey) return;
        if (document.activeElement !== button) return;
        submitLock();
      });

      function render(args) {
        submitted = false;
        const tokens = args.palette_tokens || {};
        for (const [name, value] of Object.entries(tokens)) {
          if (typeof value === "string" && value.trim()) {
            document.documentElement.style.setProperty("--as-" + name, value);
          }
        }
        button.textContent = String(args.label || "LOCK GAZE TARGET");
        button.disabled = Boolean(args.disabled);
        send("streamlit:setFrameHeight", { height: 42 });
      }

      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "streamlit:render") {
          render(event.data.args || {});
        }
      });
      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 42 });
    })();
  </script>
</body>
</html>
