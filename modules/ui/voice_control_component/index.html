<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      background: transparent;
      color: var(--as-ink);
      font: 12px/17px "IBM Plex Sans", "Noto Sans", "DejaVu Sans", sans-serif;
      margin: 0;
      padding: 0;
    }
    #root {
      background: transparent;
      border: 0;
      border-radius: 0;
      display: grid;
      gap: 8px;
      padding: 0;
    }
    #status-title { font-size: 11px; font-weight: 650; line-height: 15px; }
    #status-detail { color: var(--as-muted); font-size: 10px; line-height: 14px; }
    #meter {
      background: var(--as-segment);
      border-radius: 999px;
      height: 4px;
      overflow: hidden;
      width: 100%;
    }
    #meter-fill {
      background: var(--as-primary);
      height: 100%;
      width: 8%;
    }
    #controls, #switch {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    button {
      background: var(--as-surface);
      border: 1px solid var(--as-border-strong);
      border-radius: 3px;
      color: var(--as-ink);
      cursor: pointer;
      font: 650 11px/15px "IBM Plex Sans", "Noto Sans", "DejaVu Sans", sans-serif;
      min-height: 32px;
      padding: 6px 9px;
    }
    button:focus-visible {
      outline: 2px solid var(--as-primary);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: .58; }
    #ptt { background: var(--as-primary); color: var(--as-primary-on); flex: 1 1 150px; }
    #ptt.active { background: var(--as-slide-accent); }
    kbd {
      background: var(--as-primary-on);
      border: 1px solid var(--as-border);
      border-radius: 2px;
      color: var(--as-primary);
      font: 650 11px/15px "IBM Plex Sans", "Noto Sans", "DejaVu Sans", sans-serif;
      margin-left: 6px;
      padding: 1px 5px;
    }
    #switch {
      border-top: 1px solid var(--as-border);
      color: var(--as-muted);
      padding-top: 8px;
    }
    #switch-message { flex: 1 1 100%; }
  </style>
</head>
<body>
  <div id="root">
    <div>
      <div id="status-title">Preparing voice</div>
      <div id="status-detail">Connecting the current input mode</div>
    </div>
    <div id="meter" aria-label="Voice activity"><div id="meter-fill"></div></div>
    <div id="controls">
      <button id="ptt" type="button" hidden>Hold to speak <kbd>V</kbd></button>
      <button id="cancel" type="button" hidden>Cancel</button>
      <button id="handsfree" type="button" hidden>Pause listening</button>
      <button id="playback" type="button">Enable playback</button>
      <button id="retry" type="button" hidden>Retry</button>
    </div>
    <div id="switch" hidden>
      <span id="switch-message"></span>
      <button id="confirm" type="button">Confirm target</button>
      <button id="reject" type="button">Keep current</button>
    </div>
  </div>
  <script>
    (() => {
      const MEDIA_SESSION_KEY = "attentive-media-session";
      const SEMANTIC_KEYS = [
        "canvas", "workspace", "topbar", "rail", "surface", "ink", "muted",
        "muted-2", "border", "border-strong", "primary", "primary-on",
        "primary-soft", "segment", "slide-accent", "slide-accent-soft",
      ];
      const root = document.getElementById("root");
      const statusTitle = document.getElementById("status-title");
      const statusDetail = document.getElementById("status-detail");
      const meterFill = document.getElementById("meter-fill");
      const ptt = document.getElementById("ptt");
      const cancel = document.getElementById("cancel");
      const handsfree = document.getElementById("handsfree");
      const playback = document.getElementById("playback");
      const retry = document.getElementById("retry");
      const switchBox = document.getElementById("switch");
      const switchMessage = document.getElementById("switch-message");
      const confirm = document.getElementById("confirm");
      const reject = document.getElementById("reject");
      let args = {
        engine: "single_turn",
        flow: "one_turn",
        speech_mode: "push_to_talk",
        palette_tokens: {},
      };
      let socket = null;
      let socketSession = null;
      let pttActive = false;
      let pttStartPromise = null;
      let pttPointerId = null;
      let keyboardPttActive = false;
      let continuousSignature = null;
      let continuousPaused = false;
      let audioContext = null;
      let playbackCursor = 0;
      let reconnectTimer = null;
      let tornDown = false;
      const scheduledNodes = new Set();

      const shortcutDocuments = new Set([document]);
      const shortcutWindows = new Set([window]);
      try {
        if (window.parent && window.parent.document) {
          shortcutDocuments.add(window.parent.document);
          shortcutWindows.add(window.parent);
        }
      } catch (_) {}

      function send(type, payload = {}) {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
      }

      function setFrameHeight() {
        send("streamlit:setFrameHeight", {
          height: Math.ceil(root.getBoundingClientRect().height),
        });
      }

      function applyPalette(paletteTokens) {
        const tokens = paletteTokens && typeof paletteTokens === "object"
          ? paletteTokens
          : {};
        for (const name of SEMANTIC_KEYS) {
          const value = tokens[name];
          if (typeof value === "string" && value.trim()) {
            document.documentElement.style.setProperty("--as-" + name, value);
          }
        }
      }

      function updateStatus(title, detail, meter = 8, retryable = false) {
        statusTitle.textContent = String(title);
        statusDetail.textContent = String(detail);
        meterFill.style.width = Math.max(0, Math.min(100, Number(meter))) + "%";
        retry.hidden = !retryable;
        setFrameHeight();
      }

      function mediaSession() {
        try { return globalThis.localStorage.getItem(MEDIA_SESSION_KEY); }
        catch (_) { return null; }
      }

      async function command(path) {
        const session = mediaSession();
        if (!session) throw new Error("Enable camera and microphone first.");
        const response = await fetch(path, {
          method: "POST",
          headers: { "X-Attentive-Media-Session": session },
        });
        if (!response.ok) throw new Error("Voice command failed (" + response.status + ").");
        return response.json();
      }

      async function ensureAudioContext() {
        if (!audioContext) {
          const AudioContextClass = globalThis.AudioContext || globalThis.webkitAudioContext;
          audioContext = new AudioContextClass({ sampleRate: 24000 });
        }
        await audioContext.resume();
        playback.textContent = audioContext.state === "running"
          ? "Playback enabled"
          : "Enable playback";
      }

      function clearPlayback() {
        for (const node of scheduledNodes) {
          try { node.stop(); } catch (_) {}
        }
        scheduledNodes.clear();
        playbackCursor = audioContext ? audioContext.currentTime : 0;
      }

      async function playPcm(arrayBuffer) {
        await ensureAudioContext().catch(() => {});
        if (!audioContext || audioContext.state !== "running") return;
        const view = new DataView(arrayBuffer);
        const samples = new Float32Array(Math.floor(view.byteLength / 2));
        for (let index = 0; index < samples.length; index += 1) {
          samples[index] = view.getInt16(index * 2, true) / 32768;
        }
        const buffer = audioContext.createBuffer(1, samples.length, 24000);
        buffer.copyToChannel(samples, 0);
        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        const startsAt = Math.max(audioContext.currentTime, playbackCursor);
        playbackCursor = startsAt + buffer.duration;
        scheduledNodes.add(source);
        source.addEventListener("ended", () => scheduledNodes.delete(source), { once: true });
        source.start(startsAt);
      }

      function stateCopy(state) {
        const phase = String(state || "").toLowerCase();
        if (["recording", "sampling", "speech_detected"].includes(phase)) {
          return ["Recording", "Sampling attention", 68];
        }
        if (phase === "transcribing") return ["Transcribing", "Preparing your question", 32];
        if (phase === "resolving") return ["Resolving target", "Matching attention evidence", 22];
        if (phase === "answering") return ["Answering", "Generating a grounded explanation", 18];
        if (phase === "playing") return ["Tutor speaking", "Realtime can be interrupted", 46];
        if (phase === "paused") return ["Listening paused", "Resume when you are ready", 0];
        if (args.speech_mode === "continuous") {
          return ["Listening for speech", "Hands-free input is active", 12];
        }
        return ["Ready", "Hold V or the button to speak", 8];
      }

      function handleJson(message) {
        const payload = message.payload || {};
        if (message.type === "audio.config") return;
        if (message.type === "voice.snapshot" || message.type === "voice.state") {
          const pttState = payload.ptt && typeof payload.ptt === "object"
            ? payload.ptt
            : null;
          const pttStatus = pttState ? String(pttState.status || "") : "";
          if (["too_short", "too_long", "empty_transcript", "stt_failed"].includes(pttStatus)) {
            updateStatus(
              "Voice input needs attention",
              String(pttState.message || "Please try speaking again."),
              0,
              true
            );
          } else {
            const [title, detail, meter] = stateCopy(
              pttStatus === "recording" ? "recording" : payload.state
            );
            updateStatus(title, detail, meter);
          }
          if (payload.pending_target) {
            switchMessage.textContent = "Switch to "
              + String(payload.pending_target.label || "this target") + "?";
            switchBox.hidden = false;
          } else if (message.type === "voice.snapshot") {
            switchBox.hidden = true;
          }
        }
        if (message.type === "playback.clear") clearPlayback();
        if (message.type === "voice.error" || message.type === "voice.notice") {
          updateStatus(
            "Voice input needs attention",
            String(payload.message || "Voice unavailable"),
            0,
            true
          );
        }
        if (message.type === "target.switch.pending") {
          switchMessage.textContent = String(payload.message || "Confirm target switch?");
          switchBox.hidden = false;
        }
        if (message.type === "target.switch.completed") switchBox.hidden = true;
      }

      function handleCommandResponse(payload) {
        handleJson({ type: "voice.snapshot", payload: payload || {} });
      }

      function websocketUrl(session) {
        const url = new URL("/attentive-voice/events", window.location.href);
        url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
        url.searchParams.set("session", session);
        return url.toString();
      }

      function ensureSocket() {
        if (tornDown) return;
        const session = mediaSession();
        if (!session) {
          updateStatus("Voice unavailable", "Enable camera and microphone first", 0, true);
          ptt.disabled = true;
          handsfree.disabled = true;
          if (socket) socket.close();
          socket = null;
          socketSession = null;
          return;
        }
        ptt.disabled = false;
        handsfree.disabled = false;
        if (socket && socketSession === session && socket.readyState <= WebSocket.OPEN) return;
        if (socket) socket.close();
        socketSession = session;
        socket = new WebSocket(websocketUrl(session));
        socket.binaryType = "arraybuffer";
        socket.addEventListener("open", () => {
          const [title, detail, meter] = stateCopy("ready");
          updateStatus(title, detail, meter);
        });
        socket.addEventListener("message", (event) => {
          if (event.data instanceof ArrayBuffer) {
            void playPcm(event.data);
            return;
          }
          try { handleJson(JSON.parse(event.data)); }
          catch (_) { updateStatus("Voice unavailable", "Voice event could not be read", 0, true); }
        });
        socket.addEventListener("close", () => {
          if (!tornDown && socketSession === session) {
            updateStatus("Voice unavailable", "Voice connection closed", 0, true);
          }
        });
      }

      async function startPtt(event) {
        if (event) event.preventDefault();
        if (args.speech_mode !== "push_to_talk" || pttActive || pttStartPromise) return;
        if (event && Number.isInteger(event.pointerId) && ptt.setPointerCapture) {
          pttPointerId = event.pointerId;
          try { ptt.setPointerCapture(event.pointerId); } catch (_) {}
        }
        pttActive = true;
        cancel.hidden = false;
        ptt.classList.add("active");
        ptt.textContent = "Release to continue";
        updateStatus("Recording", "Sampling attention", 68);
        try {
          pttStartPromise = (async () => {
            await ensureAudioContext();
            return command("/attentive-voice/ptt/start");
          })();
          handleCommandResponse(await pttStartPromise);
        } catch (error) {
          pttActive = false;
          keyboardPttActive = false;
          cancel.hidden = true;
          ptt.classList.remove("active");
          ptt.replaceChildren(document.createTextNode("Hold to speak "));
          const keycap = document.createElement("kbd");
          keycap.textContent = "V";
          ptt.appendChild(keycap);
          updateStatus("Voice input needs attention", error.message, 0, true);
        } finally {
          pttStartPromise = null;
        }
      }

      function resetPttVisual() {
        cancel.hidden = true;
        ptt.classList.remove("active");
        ptt.replaceChildren(document.createTextNode("Hold to speak "));
        const keycap = document.createElement("kbd");
        keycap.textContent = "V";
        ptt.appendChild(keycap);
      }

      async function stopPtt(event) {
        if (event) event.preventDefault();
        if (!pttActive && !pttStartPromise) return;
        const pendingStart = pttStartPromise;
        pttActive = false;
        keyboardPttActive = false;
        resetPttVisual();
        if (pttPointerId !== null && ptt.releasePointerCapture) {
          try { ptt.releasePointerCapture(pttPointerId); } catch (_) {}
          pttPointerId = null;
        }
        updateStatus("Transcribing", "Preparing your question", 32);
        try {
          if (pendingStart) await pendingStart;
          handleCommandResponse(await command("/attentive-voice/ptt/stop"));
        } catch (error) {
          updateStatus("Voice input needs attention", error.message, 0, true);
        }
      }

      function keepaliveStop(path) {
        const session = mediaSession();
        if (!session) return;
        void fetch(path, {
          method: "POST",
          headers: { "X-Attentive-Media-Session": session },
          keepalive: true,
        }).catch(() => {});
      }

      function safeStopPtt() {
        if (!pttActive && !pttStartPromise) return;
        void stopPtt();
      }

      function shouldIgnoreShortcut(event) {
        const target = event.target;
        const editing = target && (
          target.matches?.("input, textarea, select, [contenteditable='true']") ||
          target.closest?.("[role='dialog'], [role='menu'], .palette-control")
        );
        return editing || event.ctrlKey || event.altKey || event.metaKey || event.shiftKey;
      }

      function onShortcutKeydown(event) {
        if (
          event.code !== "KeyV"
          || args.speech_mode !== "push_to_talk"
          || event.repeat
          || shouldIgnoreShortcut(event)
          || keyboardPttActive
        ) return;
        keyboardPttActive = true;
        void startPtt(event);
      }

      function onShortcutKeyup(event) {
        if (event.code !== "KeyV" || !keyboardPttActive) return;
        keyboardPttActive = false;
        void stopPtt(event);
      }

      function onShortcutBlur() {
        keyboardPttActive = false;
        safeStopPtt();
      }

      function onVisibilityChange() {
        for (const shortcutDocument of shortcutDocuments) {
          if (shortcutDocument.hidden) {
            onShortcutBlur();
            return;
          }
        }
      }

      async function setContinuousPaused(paused) {
        if (args.speech_mode !== "continuous") return;
        try {
          if (paused) {
            await command("/attentive-voice/continuous/stop");
            continuousPaused = true;
            handsfree.textContent = "Resume listening";
            updateStatus("Listening paused", "Resume when you are ready", 0);
          } else {
            await command("/attentive-voice/continuous/start");
            continuousPaused = false;
            handsfree.textContent = "Pause listening";
            updateStatus("Listening for speech", "Hands-free input is active", 12);
          }
        } catch (error) {
          updateStatus("Voice input needs attention", error.message, 0, true);
        }
      }

      ptt.addEventListener("pointerdown", (event) => void startPtt(event));
      ptt.addEventListener("pointerup", (event) => void stopPtt(event));
      ptt.addEventListener("pointercancel", (event) => void stopPtt(event));
      ptt.addEventListener("lostpointercapture", (event) => void stopPtt(event));
      ptt.addEventListener("keydown", (event) => {
        if ((event.code === "Space" || event.code === "Enter") && !event.repeat) {
          void startPtt(event);
        }
      });
      ptt.addEventListener("keyup", (event) => {
        if (event.code === "Space" || event.code === "Enter") void stopPtt(event);
      });
      cancel.addEventListener("click", (event) => void stopPtt(event));
      handsfree.addEventListener("click", () => void setContinuousPaused(!continuousPaused));
      playback.addEventListener("click", () => void ensureAudioContext());
      retry.addEventListener("click", () => {
        ensureSocket();
        if (args.speech_mode === "continuous" && continuousPaused) {
          void setContinuousPaused(false);
        } else {
          const [title, detail, meter] = stateCopy("ready");
          updateStatus(title, detail, meter);
        }
      });
      confirm.addEventListener("click", () => {
        void command("/attentive-voice/target/confirm").catch((error) => {
          updateStatus("Voice input needs attention", error.message, 0, true);
        });
      });
      reject.addEventListener("click", () => {
        void command("/attentive-voice/target/reject").catch((error) => {
          updateStatus("Voice input needs attention", error.message, 0, true);
        });
      });

      for (const shortcutDocument of shortcutDocuments) {
        shortcutDocument.addEventListener("keydown", onShortcutKeydown);
        shortcutDocument.addEventListener("keyup", onShortcutKeyup);
        shortcutDocument.addEventListener("visibilitychange", onVisibilityChange);
      }
      for (const shortcutWindow of shortcutWindows) {
        shortcutWindow.addEventListener("blur", onShortcutBlur);
      }

      async function render(nextArgs) {
        const previousMode = args.speech_mode;
        const previousSignature = continuousSignature;
        args = nextArgs;
        applyPalette(args.palette_tokens);
        ptt.hidden = args.speech_mode !== "push_to_talk";
        cancel.hidden = !pttActive;
        handsfree.hidden = args.speech_mode !== "continuous";
        ensureSocket();
        const session = mediaSession();
        const signature = session
          ? session + ":" + args.engine + ":" + args.speech_mode
          : null;

        if (previousMode === "continuous" && args.speech_mode !== "continuous" && session) {
          await command("/attentive-voice/continuous/stop").catch(() => {});
        }
        if (signature !== previousSignature) {
          continuousSignature = signature;
          continuousPaused = false;
          handsfree.textContent = "Pause listening";
        }
        if (
          args.speech_mode === "continuous"
          && signature
          && signature !== previousSignature
        ) {
          await command("/attentive-voice/continuous/start").catch((error) => {
            updateStatus("Voice input needs attention", error.message, 0, true);
          });
        }
        const [title, detail, meter] = stateCopy("ready");
        updateStatus(title, detail, meter);
      }

      function teardown() {
        if (tornDown) return;
        tornDown = true;
        for (const shortcutDocument of shortcutDocuments) {
          shortcutDocument.removeEventListener("keydown", onShortcutKeydown);
          shortcutDocument.removeEventListener("keyup", onShortcutKeyup);
          shortcutDocument.removeEventListener("visibilitychange", onVisibilityChange);
        }
        for (const shortcutWindow of shortcutWindows) {
          shortcutWindow.removeEventListener("blur", onShortcutBlur);
        }
        if (reconnectTimer !== null) window.clearInterval(reconnectTimer);
        clearPlayback();
        const pendingStart = pttStartPromise;
        if (pttActive || pendingStart) {
          if (pendingStart) {
            void Promise.resolve(pendingStart)
              .catch(() => null)
              .then(() => keepaliveStop("/attentive-voice/ptt/stop"));
          } else {
            keepaliveStop("/attentive-voice/ptt/stop");
          }
        }
        if (args.speech_mode === "continuous" && !continuousPaused) {
          keepaliveStop("/attentive-voice/continuous/stop");
        }
        pttActive = false;
        keyboardPttActive = false;
        if (socket) socket.close();
        socket = null;
      }

      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "streamlit:render") {
          void render(event.data.args || {});
        }
      });
      window.addEventListener("pagehide", teardown);
      window.addEventListener("beforeunload", teardown);
      reconnectTimer = window.setInterval(ensureSocket, 1000);
      send("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight();
    })();
  </script>
</body>
</html>
