<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AttentiveSlides live capture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    button { font-size: 1rem; padding: .55rem .9rem; }
    #status { font-weight: 600; }
    #audio-status { color: #475569; font-size: .9rem; margin: .35rem 0 0; }
    #gaze-status { color: #475569; font-size: .9rem; margin: .35rem 0 0; }
    video { background: #111; display: block; margin-top: .75rem; max-width: 320px; width: 100%; }
  </style>
</head>
<body>
  <p id="status">Preparing camera and microphone…</p>
  <p id="audio-status">Mic level: waiting for capture…</p>
  <p id="gaze-status">EyeTheia: waiting for capture…</p>
  <button id="permission" hidden>Grant camera/mic</button>
  <video id="preview" autoplay muted playsinline></video>
<script
  src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"
  crossorigin="anonymous"></script>
<script>
(() => {
  const FACE_MESH_ROOT =
    "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619";
  const EYETHEIA_URL = "ws://127.0.0.1:8001/ws/predict_gaze";
  const DEBUG_CHANNEL_NAME = "attentiveslides-gaze-debug-v1";
  const MEDIA_SESSION_KEY = "attentive-media-session";
  const debugChannel = typeof BroadcastChannel === "function"
    ? new BroadcastChannel(DEBUG_CHANNEL_NAME)
    : null;
  const sessionId = (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() :
    String(Date.now()) + "-" + Math.random().toString(16).slice(2);
  const status = document.getElementById("status");
  const audioStatus = document.getElementById("audio-status");
  const gazeStatus = document.getElementById("gaze-status");
  const permissionButton = document.getElementById("permission");
  const preview = document.getElementById("preview");
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("2d", { alpha: false });
  const eyeTheiaCanvas = document.createElement("canvas");
  const eyeTheiaContext = eyeTheiaCanvas.getContext("2d", { alpha: false });
  const fatigueCanvas = document.createElement("canvas");
  const fatigueContext = fatigueCanvas.getContext("2d", { alpha: false });
  const muteTimers = new Map();
  let stream = null;
  let audioContext = null;
  let mediaNode = null;
  let processor = null;
  let silentGain = null;
  let videoTimer = null;
  let heartbeatTimer = null;
  let running = false;
  let generation = null;
  let videoInFlight = false;
  let audioInFlight = false;
  let lastAudioStatusUpdate = 0;
  let faceMesh = null;
  let faceMeshTimer = null;
  let faceMeshInFlight = false;
  let latestLandmarks = null;
  let eyeTheiaFrameBusy = false;
  let eyeTheiaSocket = null;
  let eyeTheiaReconnectTimer = null;
  let eyeTheiaSequence = 0;
  let eyeTheiaViewport = null;
  let screenAcknowledged = false;
  let filterResetAcknowledged = false;
  let gazeUploadTimer = null;
  let gazeInFlight = false;
  let latestGaze = null;
  let lastGazeUploadAt = -Infinity;
  let fatigueInFlight = false;
  let lastFatigueUploadAt = -Infinity;
  const FATIGUE_INTERVAL_MS = 250;
  const TRANSPORT_FAILURE_GRACE_MS = 8000;
  const energyVadThreshold = 250;
  const transportFailures = new Map();

  function publishDebug(message) {
    if (!debugChannel) return;
    debugChannel.postMessage({ version: 1, ...message });
  }

  function clearDebugGaze() {
    publishDebug({ kind: "gaze_clear" });
  }

  function headers(extra = {}) {
    return { "X-Attentive-Media-Session": sessionId, ...extra };
  }

  function rememberMediaSession() {
    try {
      globalThis.localStorage.setItem(MEDIA_SESSION_KEY, sessionId);
    } catch (_) {}
  }

  function forgetMediaSession() {
    try {
      if (globalThis.localStorage.getItem(MEDIA_SESSION_KEY) === sessionId) {
        globalThis.localStorage.removeItem(MEDIA_SESSION_KEY);
      }
    } catch (_) {}
  }

  async function requireOk(response) {
    if (!response.ok) throw new Error(await response.text() || ("HTTP " + response.status));
    return response;
  }

  function setStatus(message) {
    status.textContent = message;
  }

  function setGazeStatus(message) {
    gazeStatus.textContent = message;
  }

  function noteTransportSuccess(channel) {
    transportFailures.delete(channel);
  }

  function noteTransportFailure(channel, error) {
    if (!running) return;
    const now = performance.now();
    const firstFailureAt = transportFailures.has(channel)
      ? transportFailures.get(channel)
      : now;
    transportFailures.set(channel, firstFailureAt);
    const detail = error && error.message ? error.message : String(error || "unavailable");
    if (now - firstFailureAt >= TRANSPORT_FAILURE_GRACE_MS) {
      void stopCapture(false, `${channel} unavailable for too long: ${detail}`);
      return;
    }
    setStatus(`${channel} interrupted; retrying…`);
  }

  function packEyeTheiaMessage(meta, payload = new ArrayBuffer(0)) {
    const metadata = new TextEncoder().encode(JSON.stringify(meta));
    const payloadBytes = payload instanceof ArrayBuffer
      ? new Uint8Array(payload)
      : new Uint8Array(payload.buffer, payload.byteOffset, payload.byteLength);
    const packed = new Uint8Array(4 + metadata.length + payloadBytes.length);
    const view = new DataView(packed.buffer);
    view.setUint32(0, metadata.length, false);
    packed.set(metadata, 4);
    packed.set(payloadBytes, 4 + metadata.length);
    return packed.buffer;
  }

  function topViewportSize() {
    try {
      const width = Number(window.top.innerWidth);
      const height = Number(window.top.innerHeight);
      if (!(width > 0 && height > 0)) throw new Error("top-level viewport is unavailable");
      return { width, height };
    } catch (error) {
      handleLocalGazeFailure("top-level viewport access failed: " + error.message, false);
      return null;
    }
  }

  function handleLocalGazeFailure(detail, reconnect = true) {
    latestGaze = null;
    clearDebugGaze();
    setGazeStatus(
      reconnect
        ? "EyeTheia: reconnecting; cloud gaze fallback active"
        : "EyeTheia: unavailable; cloud gaze fallback active"
    );
    if (reconnect) scheduleEyeTheiaReconnect();
    if (detail) console.warn("AttentiveSlides local gaze unavailable", detail);
  }

  function scheduleEyeTheiaReconnect() {
    if (!running || eyeTheiaReconnectTimer !== null) return;
    eyeTheiaReconnectTimer = window.setTimeout(() => {
      eyeTheiaReconnectTimer = null;
      connectEyeTheia();
    }, 2000);
  }

  function sendEyeTheiaControl(meta) {
    if (!eyeTheiaSocket || eyeTheiaSocket.readyState !== WebSocket.OPEN) return;
    eyeTheiaSocket.send(packEyeTheiaMessage(meta));
  }

  function announceViewport(viewport, resetFilter) {
    eyeTheiaViewport = viewport;
    screenAcknowledged = false;
    filterResetAcknowledged = !resetFilter;
    sendEyeTheiaControl({ type: "screen", w: viewport.width, h: viewport.height });
    if (resetFilter) sendEyeTheiaControl({ type: "reset_filter" });
  }

  function checkEyeTheiaViewport() {
    const viewport = topViewportSize();
    if (!viewport) return false;
    if (
      eyeTheiaViewport
      && (viewport.width !== eyeTheiaViewport.width || viewport.height !== eyeTheiaViewport.height)
    ) {
      announceViewport(viewport, true);
    }
    return true;
  }

  function scheduleGazeUpload() {
    if (!running || gazeUploadTimer !== null || gazeInFlight || latestGaze === null) return;
    const delay = Math.max(0, 200 - (performance.now() - lastGazeUploadAt));
    gazeUploadTimer = window.setTimeout(() => {
      gazeUploadTimer = null;
      void flushGazeUpload();
    }, delay);
  }

  async function flushGazeUpload() {
    if (!running || gazeInFlight || latestGaze === null) return;
    const payload = latestGaze;
    latestGaze = null;
    gazeInFlight = true;
    lastGazeUploadAt = performance.now();
    try {
      await requireOk(await fetch("/attentive-media/gaze", {
        method: "POST",
        headers: headers({ "Content-Type": "application/json" }),
        body: JSON.stringify(payload),
      }));
    } catch (error) {
      latestGaze = null;
      setGazeStatus("EyeTheia: gaze upload unavailable; cloud gaze fallback active");
    } finally {
      gazeInFlight = false;
      scheduleGazeUpload();
    }
  }

  function handleEyeTheiaMessage(event) {
    let message;
    try {
      message = JSON.parse(event.data);
    } catch (error) {
      handleLocalGazeFailure("invalid EyeTheia message: " + error.message);
      return;
    }
    if (message.type === "screen_ack") {
      screenAcknowledged = Boolean(
        eyeTheiaViewport
        && Number(message.w) === eyeTheiaViewport.width
        && Number(message.h) === eyeTheiaViewport.height
      );
      if (screenAcknowledged && filterResetAcknowledged) setGazeStatus("EyeTheia: ready");
      return;
    }
    if (message.type === "filter_reset") {
      filterResetAcknowledged = true;
      if (screenAcknowledged) setGazeStatus("EyeTheia: ready");
      return;
    }
    if (message.type === "error") {
      handleLocalGazeFailure(String(message.detail || "EyeTheia error"));
      return;
    }
    if (message.type !== "pred" || !checkEyeTheiaViewport()) return;
    if (!screenAcknowledged || !filterResetAcknowledged) return;
    const viewport = topViewportSize();
    if (!viewport) return;
    latestGaze = {
      sequence: Number(message.seq),
      browser_timestamp_ms: performance.timeOrigin + performance.now(),
      x_css: Number(message.x_px),
      y_css: Number(message.y_px),
      viewport_width: Number(window.top.innerWidth),
      viewport_height: Number(window.top.innerHeight),
      valid: true,
      face_detected: true,
      source: "eyetheia_local",
    };
    publishDebug({ kind: "gaze", ...latestGaze });
    scheduleGazeUpload();
  }

  function connectEyeTheia() {
    if (!running || (eyeTheiaSocket && eyeTheiaSocket.readyState < WebSocket.CLOSING)) return;
    const viewport = topViewportSize();
    if (!viewport) return;
    const socket = new WebSocket(EYETHEIA_URL);
    eyeTheiaSocket = socket;
    socket.addEventListener("open", () => {
      if (socket !== eyeTheiaSocket || !running) return;
      announceViewport(viewport, false);
      setGazeStatus("EyeTheia: connected; waiting for screen acknowledgement");
    });
    socket.addEventListener("message", handleEyeTheiaMessage);
    socket.addEventListener("error", () => {
      if (socket === eyeTheiaSocket) handleLocalGazeFailure("WebSocket error");
    });
    socket.addEventListener("close", () => {
      if (socket !== eyeTheiaSocket) return;
      eyeTheiaSocket = null;
      screenAcknowledged = false;
      filterResetAcknowledged = false;
      handleLocalGazeFailure("WebSocket closed");
    });
  }

  function sendCurrentEyeTheiaFrame(landmarks) {
    if (
      !eyeTheiaSocket
      || eyeTheiaSocket.readyState !== WebSocket.OPEN
      || eyeTheiaSocket.bufferedAmount > 1_000_000
      || !screenAcknowledged
      || !filterResetAcknowledged
    ) {
      eyeTheiaFrameBusy = false;
      return;
    }
    const sequence = eyeTheiaSequence++;
    eyeTheiaCanvas.toBlob(async (blob) => {
      try {
        if (!blob || !running || !eyeTheiaSocket || eyeTheiaSocket.readyState !== WebSocket.OPEN) return;
        eyeTheiaSocket.send(packEyeTheiaMessage(
          { type: "frame", seq: sequence, landmarks },
          await blob.arrayBuffer(),
        ));
      } catch (error) {
        handleLocalGazeFailure("frame send failed: " + error.message);
      } finally {
        eyeTheiaFrameBusy = false;
      }
    }, "image/jpeg", 0.9);
  }

  function uploadFatigueCrop(landmarks) {
    const now = performance.now();
    if (
      !running
      || fatigueInFlight
      || now - lastFatigueUploadAt < FATIGUE_INTERVAL_MS
      || eyeTheiaCanvas.width === 0
      || eyeTheiaCanvas.height === 0
    ) return;

    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;
    for (const landmark of landmarks) {
      const x = Number(landmark.x);
      const y = Number(landmark.y);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return;
      minX = Math.min(minX, x);
      minY = Math.min(minY, y);
      maxX = Math.max(maxX, x);
      maxY = Math.max(maxY, y);
    }
    const sourceWidth = eyeTheiaCanvas.width;
    const sourceHeight = eyeTheiaCanvas.height;
    const centerX = ((minX + maxX) / 2) * sourceWidth;
    const centerY = ((minY + maxY) / 2) * sourceHeight;
    const faceWidth = (maxX - minX) * sourceWidth;
    const faceHeight = (maxY - minY) * sourceHeight;
    const side = Math.min(
      Math.max(faceWidth, faceHeight) * 1.25,
      sourceWidth,
      sourceHeight,
    );
    if (!(side >= 1)) return;
    const sourceX = Math.max(0, Math.min(sourceWidth - side, centerX - side / 2));
    const sourceY = Math.max(0, Math.min(sourceHeight - side, centerY - side / 2));

    fatigueCanvas.width = 224;
    fatigueCanvas.height = 224;
    fatigueContext.drawImage(
      eyeTheiaCanvas,
      sourceX,
      sourceY,
      side,
      side,
      0,
      0,
      224,
      224,
    );
    fatigueInFlight = true;
    lastFatigueUploadAt = now;
    fatigueCanvas.toBlob(async (blob) => {
      if (!blob || !running) {
        fatigueInFlight = false;
        return;
      }
      try {
        await requireOk(await fetch("/attentive-media/fatigue", {
          method: "POST",
          headers: headers({
            "Content-Type": "image/jpeg",
            "X-Media-Timestamp": String(performance.now() / 1000),
          }),
          body: await blob.arrayBuffer(),
        }));
      } catch (error) {
        console.warn("AttentiveSlides fatigue upload unavailable", error);
      } finally {
        fatigueInFlight = false;
      }
    }, "image/jpeg", 0.80);
  }

  function startFaceMeshPump() {
    faceMeshTimer = window.setInterval(() => {
      if (
        !running
        || faceMeshInFlight
        || eyeTheiaFrameBusy
        || !faceMesh
        || preview.videoWidth === 0
        || !checkEyeTheiaViewport()
      ) return;
      eyeTheiaCanvas.width = preview.videoWidth;
      eyeTheiaCanvas.height = preview.videoHeight;
      eyeTheiaContext.drawImage(preview, 0, 0, eyeTheiaCanvas.width, eyeTheiaCanvas.height);
      faceMeshInFlight = true;
      eyeTheiaFrameBusy = true;
      faceMesh.send({ image: eyeTheiaCanvas }).catch((error) => {
        faceMeshInFlight = false;
        eyeTheiaFrameBusy = false;
        handleLocalGazeFailure("Face Mesh failed: " + error.message);
      });
    }, 100);
  }

  function startLocalGaze() {
    try {
      if (!window.FaceMesh) throw new Error("Face Mesh bundle did not load");
      faceMesh = new window.FaceMesh({
        locateFile: (file) => `${FACE_MESH_ROOT}/${file}`,
      });
      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6,
      });
      faceMesh.onResults((results) => {
        const faces = results && results.multiFaceLandmarks;
        latestLandmarks = (
          Array.isArray(faces)
          && faces.length === 1
          && Array.isArray(faces[0])
          && faces[0].length === 478
        ) ? faces[0] : null;
        faceMeshInFlight = false;
        if (latestLandmarks) {
          sendCurrentEyeTheiaFrame(latestLandmarks);
          uploadFatigueCrop(latestLandmarks);
        } else {
          eyeTheiaFrameBusy = false;
        }
      });
      connectEyeTheia();
      startFaceMeshPump();
    } catch (error) {
      handleLocalGazeFailure(error.message, false);
    }
  }

  function stopLocalGaze() {
    clearDebugGaze();
    window.clearInterval(faceMeshTimer);
    window.clearTimeout(eyeTheiaReconnectTimer);
    window.clearTimeout(gazeUploadTimer);
    faceMeshTimer = null;
    eyeTheiaReconnectTimer = null;
    gazeUploadTimer = null;
    latestLandmarks = null;
    latestGaze = null;
    faceMeshInFlight = false;
    eyeTheiaFrameBusy = false;
    gazeInFlight = false;
    fatigueInFlight = false;
    lastFatigueUploadAt = -Infinity;
    screenAcknowledged = false;
    filterResetAcknowledged = false;
    eyeTheiaViewport = null;
    if (eyeTheiaSocket) {
      const socket = eyeTheiaSocket;
      eyeTheiaSocket = null;
      socket.close();
    }
    if (faceMesh && typeof faceMesh.close === "function") {
      Promise.resolve(faceMesh.close()).catch(() => {});
    }
    faceMesh = null;
    setGazeStatus("EyeTheia: capture stopped.");
  }

  function updateAudioStatus(pcm) {
    const now = performance.now();
    if (now - lastAudioStatusUpdate < 250) return;
    lastAudioStatusUpdate = now;
    let peak = 0;
    for (let index = 0; index < pcm.length; index += 1) {
      peak = Math.max(peak, Math.abs(pcm[index]));
    }
    const state = peak >= energyVadThreshold ? "speech detected" : "waiting for speech";
    audioStatus.textContent = `Mic peak ${peak} · energy VAD: ${state}`;
  }

  function downsampleToS16(input, sourceRate) {
    const count = Math.max(1, Math.floor(input.length * 16000 / sourceRate));
    const output = new Int16Array(count);
    for (let index = 0; index < count; index += 1) {
      const sample = input[Math.min(input.length - 1, Math.floor(index * sourceRate / 16000))];
      output[index] = Math.max(-1, Math.min(1, sample)) * 32767;
    }
    return output;
  }

  function installTrackCleanup(track) {
    track.addEventListener("ended", () => void stopCapture(true, "Media device ended."));
    track.addEventListener("mute", () => {
      window.clearTimeout(muteTimers.get(track));
      muteTimers.set(track, window.setTimeout(() => {
        if (track.muted) void stopCapture(true, "Media device stayed muted.");
      }, TRANSPORT_FAILURE_GRACE_MS));
    });
    track.addEventListener("unmute", () => {
      window.clearTimeout(muteTimers.get(track));
      muteTimers.delete(track);
    });
  }

  async function waitForActivation(expectedGeneration) {
    for (let attempt = 0; attempt < 100; attempt += 1) {
      const payload = await (await requireOk(await fetch("/attentive-media/stats"))).json();
      if (!payload.armed) throw new Error("Master switch is off.");
      if (payload.session_state === "active" && payload.generation === expectedGeneration) return;
      await new Promise((resolve) => window.setTimeout(resolve, 50));
    }
    throw new Error("Media ingress activation timed out.");
  }

  function startVideoPump() {
    videoTimer = window.setInterval(() => {
      if (!running || videoInFlight || preview.videoWidth === 0) return;
      canvas.width = 320;
      canvas.height = Math.max(1, Math.round(preview.videoHeight * 320 / preview.videoWidth));
      context.drawImage(preview, 0, 0, canvas.width, canvas.height);
      videoInFlight = true;
      canvas.toBlob(async (blob) => {
        if (!blob || !running) {
          videoInFlight = false;
          return;
        }
        try {
          await requireOk(await fetch("/attentive-media/video", {
            method: "POST",
            headers: headers({
              "Content-Type": "image/jpeg",
              "X-Media-Timestamp": String(performance.now() / 1000),
            }),
            body: await blob.arrayBuffer(),
          }));
          noteTransportSuccess("Video transport");
        } catch (error) {
          noteTransportFailure("Video transport", error);
        } finally {
          videoInFlight = false;
        }
      }, "image/jpeg", 0.65);
    }, 200);
  }

  async function startAudioPump() {
    audioContext = new AudioContext();
    mediaNode = audioContext.createMediaStreamSource(stream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);
    silentGain = audioContext.createGain();
    silentGain.gain.value = 0;
    processor.onaudioprocess = (event) => {
      if (!running || audioInFlight) return;
      const pcm = downsampleToS16(event.inputBuffer.getChannelData(0), audioContext.sampleRate);
      updateAudioStatus(pcm);
      audioInFlight = true;
      fetch("/attentive-media/audio", {
        method: "POST",
        headers: headers({
          "Content-Type": "audio/L16",
          "X-Media-Timestamp": String(performance.now() / 1000),
          "X-Media-Sample-Rate": "16000",
          "X-Media-Channels": "1",
        }),
        body: pcm.buffer,
      }).then(requireOk).then(() => {
        noteTransportSuccess("Audio transport");
      }).catch((error) => {
        noteTransportFailure("Audio transport", error);
      }).finally(() => { audioInFlight = false; });
    };
    mediaNode.connect(processor);
    processor.connect(silentGain);
    silentGain.connect(audioContext.destination);
    await audioContext.resume();
    if (audioContext.state !== "running") throw new Error("Audio capture needs a user gesture.");
  }

  function startHeartbeat() {
    heartbeatTimer = window.setInterval(() => {
      if (!running) return;
      fetch("/attentive-media/heartbeat", { method: "POST", headers: headers() })
        .then(requireOk)
        .then(() => noteTransportSuccess("Heartbeat"))
        .catch((error) => noteTransportFailure("Heartbeat", error));
    }, 1000);
  }

  async function startCapture(fromUserGesture) {
    if (running) return;
    transportFailures.clear();
    permissionButton.hidden = true;
    try {
      const before = await (await requireOk(await fetch("/attentive-media/stats"))).json();
      if (!before.armed) {
        setStatus("Master switch is off.");
        return;
      }
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 30, max: 30 },
        },
        audio: true,
      });
      if (!stream.getVideoTracks().length || !stream.getAudioTracks().length) {
        throw new Error("Both camera and microphone tracks are required.");
      }
      stream.getTracks().forEach(installTrackCleanup);
      const started = await (
        await requireOk(await fetch("/attentive-media/start", { method: "POST", headers: headers() }))
      ).json();
      generation = started.generation;
      await waitForActivation(generation);
      rememberMediaSession();
      preview.srcObject = stream;
      await preview.play();
      running = true;
      await startAudioPump();
      startVideoPump();
      startHeartbeat();
      startLocalGaze();
      setStatus("Camera and microphone are feeding the live runtime.");
    } catch (error) {
      await stopCapture(true, "Capture did not start: " + error.message);
      permissionButton.hidden = false;
      if (!fromUserGesture) permissionButton.focus();
    }
  }

  async function stopCapture(notifyServer, message) {
    const hadCapture = running || stream;
    running = false;
    transportFailures.clear();
    forgetMediaSession();
    stopLocalGaze();
    generation = null;
    window.clearInterval(videoTimer);
    window.clearInterval(heartbeatTimer);
    videoTimer = null;
    heartbeatTimer = null;
    muteTimers.forEach((timer) => window.clearTimeout(timer));
    muteTimers.clear();
    if (processor) processor.disconnect();
    if (mediaNode) mediaNode.disconnect();
    if (silentGain) silentGain.disconnect();
    processor = null;
    mediaNode = null;
    silentGain = null;
    if (audioContext) await audioContext.close().catch(() => {});
    audioContext = null;
    audioStatus.textContent = "Mic level: capture stopped.";
    if (stream) stream.getTracks().forEach((track) => track.stop());
    stream = null;
    preview.srcObject = null;
    if (notifyServer && hadCapture) {
      await fetch("/attentive-media/stop", { method: "POST", headers: headers() }).catch(() => {});
    }
    if (message) setStatus(message);
  }

  async function refreshServerState() {
    try {
      const payload = await (await requireOk(await fetch("/attentive-media/stats"))).json();
      noteTransportSuccess("Media status");
      if (running && (
        !payload.armed || payload.session_state !== "active" || payload.generation !== generation
      )) {
        await stopCapture(false, "Server stopped the live media session.");
      }
    } catch (error) {
      noteTransportFailure("Media status", error);
    }
  }

  permissionButton.addEventListener("click", () => void startCapture(true));
  window.addEventListener("pagehide", () => {
    running = false;
    forgetMediaSession();
    stopLocalGaze();
    clearDebugGaze();
    if (debugChannel) debugChannel.close();
    if (stream) stream.getTracks().forEach((track) => track.stop());
    navigator.sendBeacon("/attentive-media/stop?session=" + encodeURIComponent(sessionId), "");
  });
  window.setInterval(refreshServerState, 1000);
  void startCapture(false);
})();
</script>
</body>
</html>
