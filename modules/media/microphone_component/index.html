<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <style>
    :root {
      color-scheme: light dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 100%;
      margin: 0;
      padding: 0.25rem;
      overflow-x: hidden;
      background: transparent;
    }

    button {
      width: 100%;
      min-height: 2.35rem;
      border: 1px solid rgba(128, 128, 128, 0.45);
      border-radius: 0.5rem;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .grid {
      display: grid;
      width: 100%;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 0.45rem;
    }

    .card {
      min-width: 0;
      min-height: 4rem;
      padding: 0.5rem;
      border: 1px solid rgba(128, 128, 128, 0.25);
      border-radius: 0.55rem;
    }

    .label {
      margin-bottom: 0.25rem;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      opacity: 0.7;
    }

    .value {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .status {
      margin-top: 0.45rem;
      font-size: 0.77rem;
      line-height: 1.35;
      opacity: 0.8;
    }

    .voice-button {
      min-height: 3rem;
      user-select: none;
      touch-action: none;
    }

    .continuous-controls {
      display: grid;
      grid-template-columns:
        minmax(0, 2fr)
        minmax(7rem, 1fr);
      gap: 0.45rem;
    }

    .speaker-on {
      outline: 2px solid currentColor;
    }

    .recording {
      outline: 2px solid currentColor;
    }

    .answer {
      margin-top: 0.45rem;
      max-height: 4.8rem;
      overflow: auto;
      font-size: 0.78rem;
      line-height: 1.35;
      white-space: pre-wrap;
    }
  
    .ptt-button {
      display: inline-flex !important;
      flex: 0 0 auto !important;
      width: auto !important;
      min-width: 7.25rem;
      max-width: 9.5rem;
      min-height: 2.25rem;
      padding: 0.4rem 0.8rem;
      align-items: center;
      justify-content: center;
      justify-self: start;
      white-space: nowrap;
    }

</style>
</head>

<body>
  <main id="root"></main>

<script>
(() => {
  "use strict";

  const params =
    new URLSearchParams(
      window.location.search
    );

  const view =
    params.get("view") || "device";

  const SESSION_KEY =
    "attentive_realtime_voice_session";

  let sessionId =
    window.localStorage.getItem(
      SESSION_KEY
    );

  if (!sessionId) {
    sessionId =
      globalThis.crypto
        ?.randomUUID?.()
      ?? `${Date.now()}-${Math.random()}`;

    window.localStorage.setItem(
      SESSION_KEY,
      sessionId,
    );
  }

  const root =
    document.getElementById("root");

  let mediaStream = null;
  let inputContext = null;
  let inputSource = null;
  let processor = null;
  let silentGain = null;

  let heartbeatTimer = null;
  let stateTimer = null;

  let chunkInFlight = false;
  let localDrops = 0;
  let suppressInput = false;

  let eventSocket = null;
  let outputContext = null;
  let playbackCursor = 0;
  let speakerEnabled = false;

  function requestHeaders(
    extra = {},
  ) {
    return {
      "X-Attentive-Voice-Session":
        sessionId,
      ...extra,
    };
  }

  async function requestJson(
    url,
    options = {},
  ) {
    const response =
      await fetch(
        url,
        options,
      );

    if (!response.ok) {
      const text =
        await response.text();

      throw new Error(
        text
        || `HTTP ${response.status}`
      );
    }

    return response.json();
  }

  async function postJson(
    url,
    payload = {},
  ) {
    return requestJson(
      url,
      {
        method: "POST",
        headers: requestHeaders({
          "Content-Type":
            "application/json",
        }),
        body: JSON.stringify(
          payload
        ),
      },
    );
  }

  async function readState() {
    return requestJson(
      "/voice/state",
      {
        headers:
          requestHeaders(),
      },
    );
  }

  function stateLabel(state) {
    return String(
      state || "off"
    )
      .replaceAll("_", " ")
      .replace(
        /\b\w/g,
        (letter) =>
          letter.toUpperCase()
      );
  }

  function downsampleToS16(
    input,
    sourceRate,
  ) {
    const targetRate = 16000;

    const outputLength =
      Math.max(
        1,
        Math.floor(
          input.length
          * targetRate
          / sourceRate
        ),
      );

    const output =
      new Int16Array(
        outputLength
      );

    for (
      let index = 0;
      index < outputLength;
      index += 1
    ) {
      const sourceIndex =
        Math.min(
          input.length - 1,
          Math.floor(
            index
            * sourceRate
            / targetRate
          ),
        );

      const sample =
        Math.max(
          -1,
          Math.min(
            1,
            input[sourceIndex],
          ),
        );

      output[index] =
        Math.round(
          sample * 32767
        );
    }

    return output;
  }

  async function sendAudio(
    pcm,
  ) {
    if (
      chunkInFlight
      || suppressInput
    ) {
      localDrops += 1;
      return;
    }

    chunkInFlight = true;

    try {
      const response =
        await fetch(
          "/voice/audio",
          {
            method: "POST",
            headers:
              requestHeaders({
                "Content-Type":
                  "audio/L16",
                "X-Audio-Sample-Rate":
                  "16000",
                "X-Audio-Channels":
                  "1",
                "X-Audio-Timestamp":
                  String(
                    performance.now()
                    / 1000
                  ),
              }),
            body: pcm.buffer,
          },
        );

      if (!response.ok) {
        throw new Error(
          await response.text()
        );
      }

    } catch (error) {
      console.error(
        "Audio upload failed:",
        error
      );

    } finally {
      chunkInFlight = false;
    }
  }

  async function startAudioPump() {
    if (mediaStream) {
      return;
    }

    mediaStream =
      await navigator.mediaDevices
        .getUserMedia({
          video: false,
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });

    if (
      !mediaStream
        .getAudioTracks()
        .length
    ) {
      throw new Error(
        "No microphone track was returned."
      );
    }

    inputContext =
      new AudioContext();

    inputSource =
      inputContext
        .createMediaStreamSource(
          mediaStream
        );

    processor =
      inputContext
        .createScriptProcessor(
          4096,
          1,
          1,
        );

    silentGain =
      inputContext.createGain();

    silentGain.gain.value = 0;

    processor.onaudioprocess =
      (event) => {
        if (!mediaStream) {
          return;
        }

        const pcm =
          downsampleToS16(
            event.inputBuffer
              .getChannelData(0),
            inputContext.sampleRate,
          );

        sendAudio(pcm);
      };

    inputSource.connect(
      processor
    );

    processor.connect(
      silentGain
    );

    silentGain.connect(
      inputContext.destination
    );

    await inputContext.resume();

    heartbeatTimer =
      window.setInterval(
        () => {
          postJson(
            "/voice/heartbeat",
            {}
          ).catch(() => {});
        },
        1000,
      );
  }

  async function stopAudioPump() {
    window.clearInterval(
      heartbeatTimer
    );

    heartbeatTimer = null;

    if (processor) {
      processor.disconnect();
      processor.onaudioprocess =
        null;
    }

    if (inputSource) {
      inputSource.disconnect();
    }

    if (silentGain) {
      silentGain.disconnect();
    }

    processor = null;
    inputSource = null;
    silentGain = null;

    if (inputContext) {
      await inputContext
        .close()
        .catch(() => {});
    }

    inputContext = null;

    if (mediaStream) {
      mediaStream
        .getTracks()
        .forEach(
          (track) =>
            track.stop()
        );
    }

    mediaStream = null;
  }

  function pcm16ToFloat32(
    arrayBuffer,
  ) {
    const input =
      new Int16Array(
        arrayBuffer
      );

    const output =
      new Float32Array(
        input.length
      );

    for (
      let index = 0;
      index < input.length;
      index += 1
    ) {
      output[index] =
        input[index] / 32768;
    }

    return output;
  }

  async function prepareSpeaker() {
    if (!outputContext) {
      outputContext =
        new AudioContext({
          sampleRate: 24000,
        });
    }

    await outputContext.resume();
  }

  function enqueueSpeakerAudio(
    arrayBuffer,
  ) {
    if (!outputContext) {
      return;
    }

    const samples =
      pcm16ToFloat32(
        arrayBuffer
      );

    const audioBuffer =
      outputContext
        .createBuffer(
          1,
          samples.length,
          24000,
        );

    audioBuffer.copyToChannel(
      samples,
      0,
    );

    const source =
      outputContext
        .createBufferSource();

    source.buffer =
      audioBuffer;

    source.connect(
      outputContext.destination
    );

    const startAt =
      Math.max(
        outputContext
          .currentTime
          + 0.02,
        playbackCursor,
      );

    source.start(
      startAt
    );

    playbackCursor =
      startAt
      + audioBuffer.duration;
  }

  function clearPlayback() {
    playbackCursor = 0;

    if (outputContext) {
      outputContext
        .close()
        .catch(() => {});

      outputContext = null;
    }
  }

  function eventSocketUrl() {
    const protocol =
      window.location.protocol
      === "https:"
        ? "wss:"
        : "ws:";

    return (
      `${protocol}//`
      + window.location.host
      + "/voice/events"
      + `?session=${encodeURIComponent(
          sessionId
        )}`
    );
  }

  function openEventSocket(
    onMessage,
  ) {
    if (
      eventSocket
      && (
        eventSocket.readyState
        === WebSocket.OPEN
        || eventSocket.readyState
        === WebSocket.CONNECTING
      )
    ) {
      return;
    }

    eventSocket =
      new WebSocket(
        eventSocketUrl()
      );

    eventSocket.binaryType =
      "arraybuffer";

    eventSocket.onmessage =
      (event) => {
        if (
          event.data
          instanceof ArrayBuffer
        ) {
          if (speakerEnabled) {
            enqueueSpeakerAudio(
              event.data
            );
          }

          return;
        }

        try {
          onMessage(
            JSON.parse(
              event.data
            )
          );

        } catch (error) {
          console.error(
            "Invalid voice event:",
            error
          );
        }
      };
  }

  function renderDeviceView() {
    root.innerHTML = `
      <div
        class="grid"
        data-testid="system-status-grid"
        data-columns="2"
        data-rows="2"
        data-items="4"
      >
        <div class="card">
          <div class="label">MODE</div>
          <div
            class="value"
            id="modeValue"
          >
            Manual
          </div>
        </div>

        <div class="card">
          <div class="label">
            CLOUD TUTOR
          </div>
          <div
            class="value"
            id="cloudValue"
          >
            Checking
          </div>
        </div>

        <div class="card">
          <div class="label">
            CAMERA
          </div>
          <button id="cameraButton">
            Off
          </button>
        </div>

        <div class="card">
          <div class="label">
            MICROPHONE
          </div>
          <button id="microphoneButton">
            Off
          </button>
        </div>
      </div>

      <div
        class="status"
        id="deviceStatus"
      >
        Loading device state…
      </div>
    `;

    const modeValue =
      document.getElementById(
        "modeValue"
      );

    const cloudValue =
      document.getElementById(
        "cloudValue"
      );

    const cameraButton =
      document.getElementById(
        "cameraButton"
      );

    const microphoneButton =
      document.getElementById(
        "microphoneButton"
      );

    const deviceStatus =
      document.getElementById(
        "deviceStatus"
      );

    cameraButton.addEventListener(
      "click",
      async () => {
        cameraButton.disabled =
          true;

        try {
          await postJson(
            "/voice/device/camera/toggle"
          );

        } finally {
          cameraButton.disabled =
            false;
        }
      },
    );

    microphoneButton
      .addEventListener(
        "click",
        async () => {
          microphoneButton.disabled =
            true;

          try {
            const state =
              await readState();

            if (
              state.microphone_enabled
            ) {
              await stopAudioPump();

              await postJson(
                "/voice/device/microphone",
                {
                  enabled: false,
                  permission:
                    "unknown",
                },
              );

            } else {
              try {
                await startAudioPump();

                await postJson(
                  "/voice/device/microphone",
                  {
                    enabled: true,
                    permission:
                      "granted",
                  },
                );

              } catch (error) {
                await stopAudioPump();

                await postJson(
                  "/voice/device/microphone",
                  {
                    enabled: false,
                    permission:
                      "denied",
                  },
                );

                deviceStatus
                  .textContent =
                  `Microphone permission `
                  + `failed: `
                  + error.message;
              }
            }

          } finally {
            microphoneButton.disabled =
              false;
          }
        },
      );

    async function refresh() {
      try {
        const state =
          await readState();

        modeValue.textContent =
          state.interaction_mode
          === "hybrid"
            ? "Hybrid"
            : "Manual";

        cameraButton.textContent =
          state.camera_enabled
            ? "On"
            : "Off";

        microphoneButton
          .textContent =
          state.microphone_enabled
            ? "On"
            : "Off";

        cloudValue.textContent =
          state.cloud_tutor_available
            ? "Available"
            : "Offline";

        suppressInput =
          Boolean(
            state.suppress_input
          );

        deviceStatus.textContent =
          state.microphone_enabled
            ? (
                `Microphone granted · `
                + `${state.voice_state}`
              )
            : (
                `Microphone `
                + `${state.microphone_permission}`
              );

        if (
          !state.microphone_enabled
          && mediaStream
        ) {
          await stopAudioPump();
        }

      } catch (error) {
        deviceStatus.textContent =
          `Device state unavailable: `
          + error.message;
      }
    }

    stateTimer =
      window.setInterval(
        refresh,
        500,
      );

    refresh();
  }

  function renderPushToTalkView() {
    root.innerHTML = `
      <button
        id="holdButton"
        class="voice-button ptt-button"
        disabled
       data-testid="hold-to-ask-button">
        Microphone is off
      </button>

      <div
        class="status"
        id="pttStatus"
      >
        Enable Microphone in the sidebar.
      </div>

      <div
        class="answer"
        id="pttAnswer"
      ></div>
    `;

    const holdButton =
      document.getElementById(
        "holdButton"
      );

    const status =
      document.getElementById(
        "pttStatus"
      );

    const answer =
      document.getElementById(
        "pttAnswer"
      );

    let recording = false;
    let activePointer = null;

    async function startRecording(
      event,
    ) {
      event.preventDefault();

      const state =
        await readState();

      if (
        !state.microphone_enabled
        || state.microphone_permission
          !== "granted"
        || state.continuous_enabled
      ) {
        return;
      }

      activePointer =
        event.pointerId;

      holdButton.setPointerCapture(
        activePointer
      );

      await postJson(
        "/voice/ptt/start"
      );

      recording = true;

      holdButton.classList.add(
        "recording"
      );

      holdButton.textContent =
        "Recording… release to ask";
    }

    async function stopRecording(
      event,
    ) {
      if (!recording) {
        return;
      }

      event?.preventDefault?.();

      recording = false;

      holdButton.classList.remove(
        "recording"
      );

      await postJson(
        "/voice/ptt/stop"
      );

      holdButton.textContent =
        "Processing…";
    }

    holdButton.addEventListener(
      "pointerdown",
      (event) => {
        startRecording(
          event
        ).catch(
          (error) => {
            status.textContent =
              error.message;
          },
        );
      },
    );

    for (
      const eventName
      of [
        "pointerup",
        "pointercancel",
        "lostpointercapture",
      ]
    ) {
      holdButton.addEventListener(
        eventName,
        (event) => {
          stopRecording(
            event
          ).catch(
            (error) => {
              status.textContent =
                error.message;
            },
          );
        },
      );
    }

    openEventSocket(
      (message) => {
        if (
          message.type
          === "answer.text.delta"
        ) {
          answer.textContent =
            message.text || "";
        }

        if (
          message.type
          === "turn.rejected"
        ) {
          status.textContent =
            `Ignored: `
            + message.reason;
        }
      },
    );

    async function refresh() {
      try {
        const state =
          await readState();

        const enabled =
          state.microphone_enabled
          && state
            .microphone_permission
            === "granted"
          && !state
            .continuous_enabled
          && ![
            "responding",
            "playing",
            "transcribing",
          ].includes(
            state.voice_state
          );

        holdButton.disabled =
          !enabled;

        if (!recording) {
          holdButton.textContent =
            enabled
              ? "Hold to ask"
              : (
                  state
                    .continuous_enabled
                    ? (
                        "Continuous mode "
                        + "is active"
                      )
                    : (
                        "Microphone "
                        + "is unavailable"
                      )
                );
        }

        status.textContent =
          stateLabel(
            state.voice_state
          );

        if (
          state.latest_answer_text
        ) {
          answer.textContent =
            state
              .latest_answer_text;
        }

      } catch (error) {
        status.textContent =
          error.message;
      }
    }

    stateTimer =
      window.setInterval(
        refresh,
        400,
      );

    refresh();
  }

  function renderContinuousView() {
    root.innerHTML = `
      <div class="continuous-controls">
        <button
          id="continuousButton"
          class="voice-button"
          disabled
        >
          Start continuous conversation
        </button>

        <button
          id="speakerButton"
          class="voice-button"
          disabled
        >
          Speaker Off
        </button>
      </div>

      <div
        class="status"
        id="continuousStatus"
      >
        Enable Microphone in the sidebar.
      </div>

      <div
        class="answer"
        id="continuousAnswer"
      ></div>
    `;

    const button =
      document.getElementById(
        "continuousButton"
      );

    const speakerButton =
      document.getElementById(
        "speakerButton"
      );

    const status =
      document.getElementById(
        "continuousStatus"
      );

    const answer =
      document.getElementById(
        "continuousAnswer"
      );

    openEventSocket(
      (message) => {
        if (
          message.type
          === "answer.text.delta"
        ) {
          answer.textContent =
            message.text || "";
        }

        if (
          message.type
          === "playback.clear"
        ) {
          clearPlayback();
        }

        if (
          message.type
          === "turn.rejected"
        ) {
          status.textContent =
            `Ignored: `
            + message.reason;
        }
      },
    );

    button.addEventListener(
      "click",
      async () => {
        button.disabled =
          true;

        try {
          const state =
            await readState();

          if (
            state.continuous_enabled
          ) {
            await postJson(
              "/voice/continuous/stop"
            );

            clearPlayback();

          } else {
            if (
              state.speaker_enabled
            ) {
              await prepareSpeaker();
            }

            openEventSocket(
              () => {}
            );

            await postJson(
              "/voice/continuous/start"
            );
          }

        } finally {
          button.disabled =
            false;
        }
      },
    );

    speakerButton.addEventListener(
      "click",
      async () => {
        speakerButton.disabled =
          true;

        try {
          const state =
            await readState();

          if (
            state.speaker_enabled
          ) {
            await postJson(
              "/voice/device/speaker",
              {
                enabled: false,
              },
            );

            speakerEnabled = false;

            speakerButton
              .classList.remove(
                "speaker-on"
              );

            clearPlayback();

          } else {
            /*
             * AudioContext.resume() runs
             * directly inside the user's
             * click gesture to satisfy
             * browser autoplay policy.
             */
            await prepareSpeaker();

            await postJson(
              "/voice/device/speaker",
              {
                enabled: true,
              },
            );

            speakerEnabled = true;

            speakerButton
              .classList.add(
                "speaker-on"
              );
          }

        } catch (error) {
          status.textContent =
            `Speaker error: `
            + error.message;

        } finally {
          speakerButton.disabled =
            false;
        }
      },
    );

    async function refresh() {
      try {
        const state =
          await readState();

        const available =
          state.microphone_enabled
          && state
            .microphone_permission
            === "granted";

        button.disabled =
          !available;

        speakerButton.disabled =
          !available;

        speakerEnabled = Boolean(
          state.speaker_enabled
        );

        speakerButton.textContent =
          speakerEnabled
            ? "Speaker On"
            : "Speaker Off";

        speakerButton.classList.toggle(
          "speaker-on",
          speakerEnabled,
        );

        button.textContent =
          state.continuous_enabled
            ? (
                "Stop continuous "
                + "conversation"
              )
            : (
                "Start continuous "
                + "conversation"
              );

        status.textContent =
          stateLabel(
            state.voice_state
          );

        if (
          state.latest_answer_text
        ) {
          answer.textContent =
            state
              .latest_answer_text;
        }

      } catch (error) {
        status.textContent =
          error.message;
      }
    }

    stateTimer =
      window.setInterval(
        refresh,
        400,
      );

    refresh();
  }

  if (view === "ptt") {
    renderPushToTalkView();

  } else if (
    view === "continuous"
  ) {
    renderContinuousView();

  } else {
    renderDeviceView();
  }

  window.addEventListener(
    "pagehide",
    () => {
      window.clearInterval(
        stateTimer
      );

      if (eventSocket) {
        eventSocket.close();
      }

      clearPlayback();

      if (
        view === "device"
        && mediaStream
      ) {
        mediaStream
          .getTracks()
          .forEach(
            (track) =>
              track.stop()
          );
      }
    },
  );
})();
</script>
</body>
</html>
